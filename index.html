<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HIROCROSS PLAN</title>

<!-- FAVICON -->
<link rel="icon" href="./Hirocross-logo.png" type="image/png">
<meta name="theme-color" content="#0f172a">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.0"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://urifesrfboutokrmxnwu.supabase.co";
  const SUPABASE_KEY = "sb_publishable_rrLXObFQkHYsrgQAiVJRnw_UhdiLe8S";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>

<style>
:root{
  --primary:#0f172a;
  --accent:#2563eb;
  --bg:#f1f5f9;
  --success:#10b981;
  --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:#1e293b;
}

/* ===== HEADER ===== */
header{
  background:var(--primary);
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  position:sticky;
  top:0;
  z-index:1000;
}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px}
.brand h1{font-size:1rem;font-weight:800;letter-spacing:1px}

/* ===== LAYOUT ===== */
.app-shell{
  display:flex;
  min-height:calc(100vh - 64px);
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:240px;
  background:#020617;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.sidebar h3{
  color:#94a3b8;
  font-size:.7rem;
  letter-spacing:1px;
  margin-bottom:8px;
}
.sidebar button{
  background:none;
  border:none;
  color:#cbd5e1;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:800;
  text-align:left;
}
.sidebar button:hover{background:rgba(255,255,255,.08)}
.sidebar button.active{
  background:rgba(255,255,255,.15);
  color:#fff;
}

/* ===== MAIN ===== */
.main{flex:1;padding:24px}
.section{display:none}
.section.active{display:block}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

/* ===== AUTH OVERLAY ===== */
#authOverlay{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.auth-card{
  background:#fff;
  padding:24px;
  width:100%;
  max-width:360px;
  border-radius:18px;
  text-align:center;
}
.auth-card h2{margin-bottom:6px}
.auth-card input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #cbd5e1;
}
.auth-card button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}
.btn-login{background:var(--accent);color:#fff}
.btn-sign{background:var(--success);color:#fff;margin-top:6px}
.auth-msg{font-size:.8rem;font-weight:800;margin-top:10px}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authOverlay">
  <div class="auth-card">
    <h2>HIROCROSS PLAN</h2>
    <p style="font-size:.8rem;color:#64748b">Login / Daftar</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="btn-login" onclick="login()">LOGIN</button>
    <button class="btn-sign" onclick="signup()">DAFTAR</button>
    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<header>
  <div class="brand">
    <img src="./Hirocross-logo.png">
    <h1>HIROCROSS</h1>
  </div>
  <button onclick="logout()" style="background:#ef4444;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer">LOGOUT</button>
</header>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>MENU</h3>
    <button class="active" onclick="show('setup',this)">SETUP</button>
    <button onclick="show('annual',this)">ANNUAL PLAN</button>
    <button onclick="show('monthly',this)">BULANAN</button>
    <button onclick="show('monitor',this)">MONITORING</button>
    <button onclick="show('test',this)">TES & PENGUKURAN</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <section id="setup" class="section active">
      <div class="card">
        <h2>Setup Program</h2>
        <p>Parameter dasar program latihan.</p>
      </div>
    </section>

    <section id="annual" class="section">
      <div class="card">
        <h2>Annual Plan</h2>
        <p>Struktur periodisasi tahunan.</p>
      </div>
    </section>

    <section id="monthly" class="section">
      <div class="card">
        <h2>Bulanan</h2>
        <p>Kalender latihan bulanan.</p>
      </div>
    </section>

    <section id="monitor" class="section">
      <div class="card">
        <h2>Monitoring</h2>
        <p>Analisis & dashboard performa.</p>
      </div>
    </section>

    <section id="test" class="section">
      <div class="card">
        <h2>Tes & Pengukuran</h2>
        <p>Input dan analisis tes fisik.</p>
      </div>
    </section>

  </main>
</div>

<script>
function show(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.sidebar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* ===== AUTH ===== */
function msg(t,c="#ef4444"){
  const m=document.getElementById("authMsg");
  m.style.color=c;m.innerText=t;
}

async function login(){
  const email=emailEl.value,password=passEl.value;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error) msg(error.message);
}

async function signup(){
  const email=emailEl.value,password=passEl.value;
  const {error}=await supabaseClient.auth.signUp({email,password});
  if(error) msg(error.message);
  else msg("Akun dibuat, silakan login","#10b981");
}

async function logout(){
  await supabaseClient.auth.signOut();
}

const emailEl=document.getElementById("email");
const passEl=document.getElementById("password");

supabaseClient.auth.onAuthStateChange((_,session)=>{
  document.getElementById("authOverlay").style.display=session?"none":"flex";
});
</script>

</body>
</html>
